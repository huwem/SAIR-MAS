name: vanilla_reasoning_local
description: Reasoning tasks with vanilla single-agent baseline on local model
dataset:
  loader: aime
  path: datasets/aime/aime_*.jsonl
  limit: null
  offset: 0
  random_offset: false
evaluation:
  metric: llm_judge
  metric_params:
    model: deepseek-v4-flash
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    temperature: 0.3
    max_tokens: 32000
output:
  dir: null
  formats: [json, csv]
  trace: true
framework:
  llm:
    provider: openai_compat
    model: llama3-8b
    api_key: sk-placeholder
    base_url: http://127.0.0.1:8000/v1
    temperature: 0.2
    max_tokens: 32000
    json_mode: true
  agents:
    - type: LLMAgent
      name: Solver
      role: Mathematical Solver
      system_prompt: |
        Solve the given math problem.

        Output ONLY a JSON object:
        {
          "answer": "<final numerical value or simplest expression in standard LaTeX>"
        }
      output_format: json
      required_output_fields: [answer]
      memory_max_rounds: 1
      memory_limit: 2000
      context_fields: [current_answer]
  topology:
    strategy: fixed
    pattern: direct_answer
  routing:
    strategy: broadcast
    memory_truncate: 3000
  decision:
    strategy: direct
    max_rounds: 1
  memory:
    strategy: message_log
  max_rounds: 1
  verbose: true
