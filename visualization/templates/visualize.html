<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PragmaMAS Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { height: 100vh; overflow: hidden; }
        #sidebar { width: 280px; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; }
        #sidebar-top { overflow-y: auto; flex-shrink: 0; }
        #sampleList { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; background: #fff; }
        .sample-item { padding: 5px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
        .sample-item:hover { background: #e2e6ea; }
        .sample-item.active { background: #0d6efd; color: #fff; }
        .sample-item.active:hover { background: #0b5ed7; }
        #sampleCount { font-size: 11px; }
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #controls { padding: 10px 15px; border-bottom: 1px solid #dee2e6; }
        #content { flex: 1; overflow-y: auto; padding: 15px; }
        .vis-container { height: 520px; border: 1px solid #dee2e6; border-radius: 6px; background: #fff; }
        .metric-card { min-width: 140px; }
        #detailPanel { width: 360px; border-left: 1px solid #dee2e6; overflow-y: auto; padding: 15px; }
        pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="d-flex">
    <div id="sidebar" class="p-3 bg-light">
        <div id="sidebar-top">
            <h5 class="mb-3">PragmaMAS Visualizer</h5>
            <div class="mb-2">
                <label class="form-label">Run</label>
                <select id="runSelect" class="form-select form-select-sm"></select>
            </div>
            <div class="mb-2">
                <label class="form-label">Samples <span id="sampleCount" class="text-muted"></span></label>
                <div id="sampleList"></div>
            </div>
            <button id="loadBtn" class="btn btn-primary btn-sm w-100 mt-2">Refresh</button>
            <hr>
            <div id="runInfo" class="small text-muted"></div>
        </div>
        <div id="sidebar-bottom" class="mt-auto pt-2 border-top small text-muted">
            Powered by vis.js
        </div>
    </div>

    <div id="main">
        <div id="controls" class="d-flex align-items-center gap-3 bg-white flex-wrap">
            <label class="form-label m-0">Round</label>
            <input id="roundSlider" type="range" class="form-range" style="width: 200px;" min="1" max="1" value="1">
            <span id="roundLabel" class="badge bg-secondary">1 / 1</span>
            <button id="playBtn" class="btn btn-sm btn-outline-primary">▶ Play</button>
            <button id="restartPhysicsBtn" class="btn btn-sm btn-outline-secondary">Restart Physics</button>
            <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="allRoundsCheck">
                <label class="form-check-label" for="allRoundsCheck">All rounds</label>
            </div>
        </div>

        <div id="content">
            <ul class="nav nav-tabs" id="vizTabs" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-both">Topology & Communication</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-tree">Round Tree</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ledger">Ledger</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-metrics">Metrics</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-activity">Activity</button></li>
            </ul>

            <div class="tab-content pt-3">
                <div class="tab-pane fade show active" id="tab-both">
                    <div class="row">
                        <div class="col-md-6"><div id="topologyNetBoth" class="vis-container"></div></div>
                        <div class="col-md-6"><div id="communicationNetBoth" class="vis-container"></div></div>
                    </div>
                </div>
                <div class="tab-pane fade" id="tab-tree">
                    <div class="row">
                        <div class="col-md-7"><div id="treeNet" class="vis-container"></div></div>
                        <div class="col-md-5">
                            <h6>Vote Complete Summary</h6>
                            <div id="voteTable" style="max-height:520px;overflow-y:auto"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="tab-ledger"><div id="ledgerTable"></div></div>
                <div class="tab-pane fade" id="tab-metrics"><div id="metricsCards" class="d-flex flex-wrap gap-3"></div></div>
                <div class="tab-pane fade" id="tab-activity">
                    <div class="row">
                        <div class="col-md-6"><canvas id="activityChart"></canvas></div>
                        <div class="col-md-6"><canvas id="illocutionChart"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailPanel" class="bg-light d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="m-0">Details</h6>
            <button id="closeDetail" class="btn btn-sm btn-close"></button>
        </div>
        <pre id="detailContent" class="small"></pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://unpkg.com/vis-network@9.1.13/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/visualize.js"></script>
</body>
</html>
